<!DOCTYPE html>
<!-- ============================================================
     index.html —— 登录成功后的"下一个界面"（开始页占位版）

     目前内容：全屏显示 登录页面.png（人物居中的那张原始背景图），
     打开时从全白淡入画面 —— 正好接住登录页开场视频结尾的全白，
     形成"登录页 → 视频变白 → 本页从白色浮现"的无缝转场。

     以后这里可以换成真正的游戏开始菜单（开始游戏 / 加载存档 / 退出）。
     ============================================================ -->
<html lang="zh-CN" data-page-node-id="kTQj13nGBODQIcS78GR8qT">

<head data-page-node-id="deDh4xFy3E0l6jTdzczrWg">
  <meta charset="UTF-8" data-page-node-id="uUZtxNnfdGaBPTVeHpP6te">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="UCIlbK9Di5ixCUNaJFLbNZ">
  <title>开始页</title>
  <style>
    /* ---------- 页面主体：全屏背景图 ---------- */
    body {
      margin: 0;
      height: 100vh;                 /* 高度撑满整个窗口 */
      /* ../ 表示上一级目录：本文件在 login/ 里，图片在工作区根目录 */
      background-image: url('./登录页面-人物居左.png');
      background-size: cover;        /* 等比缩放到刚好盖满窗口 */
      background-position: center;   /* 人物保持在画面正中 */
      background-repeat: no-repeat;
    }

    /* ---------- 白屏淡入层 ---------- */
    /* 页面一打开时这层是纯白不透明，然后用 1 秒慢慢变透明，
       露出下面的背景图 —— 和登录页视频结尾的全白无缝衔接 */
    .white-flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #fff;
      /* forwards：动画播完后停在最后一帧（保持透明），不会闪回白色 */
      animation: fadeOut 1s ease-out forwards;
    }
    @keyframes fadeOut {
      from { opacity: 1; }           /* 开始：纯白 */
      to   { opacity: 0; visibility: hidden; }  /* 结束：完全透明且不挡点击 */
    }
    .start-menu { position: absolute; right: 10%; top: 35%; padding: 32px; color: #fff; background: #142138db; border: 1px solid #9caebc; border-radius: 12px; font-family: system-ui, sans-serif; }
    .start-menu a { display: block; margin-top: 20px; padding: 12px 24px; color: #172539; background: #ecd5aa; border-radius: 6px; text-decoration: none; text-align: center; }
    .white-flash { pointer-events: none; }
  </style>
</head>

<body data-page-node-id="xVSIOfWr1sbTbtZXjRPg7X">
  <!-- 白屏淡入层：只负责转场，没有任何交互 -->
  <div class="white-flash" data-page-node-id="lLmrvI3CcGep124ztWueZl"></div>

  <main class="start-menu">
    <h1>I.L.Y</h1>
    <p>故事，从那封信开始。</p>
    <a id="enterGame" href="../game/index.html">进入游戏</a>
    <a href="./login.html">返回登录</a>
  </main>
  <script>
    const player = new URLSearchParams(location.search).get('player');
    if (player) {
      const game = new URL('../game/index.html', location.href);
      game.searchParams.set('player', player);
      document.getElementById('enterGame').href = game.href;
    }
  </script>
</body>

</html>
