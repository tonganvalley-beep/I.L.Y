<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I.L.Y. · 七幕回响</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="wrap">
  <header class="toolbar">
    <div class="brand">I.L.Y. <span>七幕回响</span></div>
    <div class="controls">
      <button id="motion" type="button" aria-pressed="true">动态：开</button>
      <button id="pause" type="button">暂停</button>
      <button id="fullscreen" type="button">全屏</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv" width="960" height="540" aria-label="弹幕战斗区域，方向键移动，Shift 低速，P 暂停，R 重开"></canvas>
    <section id="overlay" class="show">
      <p class="eyebrow">BOSS ENCOUNTER / 07 ACTS</p>
      <h1>七幕回响</h1>
      <p>躲开她的执念，接住她的温柔。</p>
      <div class="legend"><span>◆ ILY · 攻击</span><span>◆ 爱理 · 治疗</span></div>
      <p class="instructions">方向键移动 · Shift 低速穿缝<br>约五分钟的七幕挑战，HP 跨幕保留。<br>红点与虚线是预警；绿色词条和光球会回血。</p>
      <button id="start" type="button">正在准备…</button>
      <p class="small">建议使用键盘，点击右上角进入全屏</p>
    </section>
  </div>
  <footer><span id="actLabel">第 1 幕 · ILY 攻击</span><span id="status">方向键移动 · Shift 低速 · P 暂停 · R 重开</span><span><b id="fps">30</b> FPS</span></footer>
</main>
<script src="scene-media.js"></script>
<script src="game.js"></script>
</body>
</html>
