<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69d5ff"/></marker><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#27485d" stroke-width="1"/></pattern></defs>
  <rect width="1600" height="900" fill="#081523"/>
  <style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#f5f4ef;letter-spacing:0}.mono{font-family:Consolas,"Microsoft YaHei",monospace}.cyan{fill:#69d5ff}.orange{fill:#ff9a70}.muted{fill:#a9c8dc}.panel{fill:#12283a}.edge{stroke:#69d5ff;stroke-width:3;fill:none;marker-end:url(#arr4)}.thin{stroke:#3b6075;stroke-width:2;fill:none}</style>
  <text x="68" y="58" class="cyan" font-size="20" font-weight="700">关键算法 02 / 连续移动与碰撞</text>
  <text x="68" y="135" font-size="50" font-weight="700">连续手感，来自离散的小步检测</text>
  <text x="68" y="181" class="muted" font-size="24">归一化方向、按时间计算位移，再拆成小步逐轴尝试，避免穿墙并允许沿墙滑动。</text>

  <g>
    <rect x="70" y="255" width="760" height="500" class="panel"/>
    <text x="105" y="304" class="cyan" font-size="22" font-weight="700">算法流程</text>
    <g>
      <rect x="105" y="342" width="180" height="90" fill="#0e2131"/><text x="195" y="376" text-anchor="middle" class="mono orange" font-size="18">input</text><text x="195" y="405" text-anchor="middle" font-size="17">方向键 / WASD</text>
      <path d="M285 387H338" class="edge"/>
      <rect x="338" y="342" width="190" height="90" fill="#0e2131"/><text x="433" y="376" text-anchor="middle" class="mono orange" font-size="18">normalize</text><text x="433" y="405" text-anchor="middle" font-size="17">斜向速度不加倍</text>
      <path d="M528 387H581" class="edge"/>
      <rect x="581" y="342" width="210" height="90" fill="#0e2131"/><text x="686" y="376" text-anchor="middle" class="mono orange" font-size="18">distance</text><text x="686" y="405" text-anchor="middle" font-size="17">speed × Δt</text>
    </g>
    <path d="M686 432V484H195" class="edge"/>
    <rect x="105" y="484" width="180" height="90" fill="#0e2131"/><text x="195" y="518" text-anchor="middle" class="mono orange" font-size="18">substeps</text><text x="195" y="547" text-anchor="middle" font-size="17">每步 ≤ 0.1 格</text>
    <path d="M285 529H338" class="edge"/>
    <rect x="338" y="484" width="190" height="90" fill="#0e2131"/><text x="433" y="518" text-anchor="middle" class="mono orange" font-size="18">try X</text><text x="433" y="547" text-anchor="middle" font-size="17">横轴可站立？</text>
    <path d="M528 529H581" class="edge"/>
    <rect x="581" y="484" width="210" height="90" fill="#0e2131"/><text x="686" y="518" text-anchor="middle" class="mono orange" font-size="18">try Y</text><text x="686" y="547" text-anchor="middle" font-size="17">纵轴可站立？</text>
    <path d="M686 574V626H433" class="edge"/>
    <rect x="300" y="626" width="266" height="88" fill="#0e2131"/><text x="433" y="660" text-anchor="middle" class="mono orange" font-size="18">clamp camera</text><text x="433" y="690" text-anchor="middle" font-size="17">镜头限制在地图边界</text>
  </g>

  <rect x="880" y="255" width="650" height="500" class="panel"/>
  <text x="915" y="304" class="cyan" font-size="22" font-weight="700">逐轴检测示意</text>
  <rect x="950" y="342" width="504" height="336" fill="url(#grid)"/>
  <g fill="#36566a"><rect x="1286" y="342" width="42" height="210"/><rect x="1286" y="594" width="42" height="84"/><rect x="1328" y="510" width="126" height="42"/></g>
  <circle cx="1055" cy="594" r="20" fill="#ff9a70"/><text x="1055" y="600" text-anchor="middle" font-size="16" font-weight="700">P</text>
  <path d="M1080 575L1265 455" stroke="#ff9a70" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arr4)"/>
  <text x="1128" y="515" class="orange" font-size="16">原始位移</text>
  <path d="M1080 594H1254" class="edge"/><path d="M1265 584V555" class="edge"/>
  <text x="1166" y="625" text-anchor="middle" class="cyan" font-size="16">先尝试 X</text><text x="1370" y="582" text-anchor="middle" class="muted" font-size="15">X 被墙阻挡</text>
  <path d="M1254 594V565" stroke="#ff9a70" stroke-width="4" marker-end="url(#arr4)"/>
  <text x="1195" y="682" class="muted" font-size="16">Y 仍可更新 → 角色沿墙滑动</text>

  <g><text x="915" y="720" class="mono orange" font-size="18">canStandRpg(x, y)</text><text x="1130" y="720" class="muted" font-size="17">检查边界与 blocked cells</text></g>
  <text x="68" y="818" class="cyan" font-size="20" font-weight="700">结果</text><text x="150" y="818" font-size="19">帧率变化不改变速度 · 高速移动不穿墙 · 接触墙面仍能自然滑动</text>
  <text x="68" y="865" class="muted" font-size="16">依据：game/src/modes/rpg.js · tick() · game/src/core/state.js · moveRpg() / canStandRpg()</text>
</svg>
