  <script>
    /* ---------- 全屏状态跨页面保持 ----------
       浏览器限制：页面跳转必然退出全屏，且重新全屏必须由用户手势触发。
       方案：进入全屏时在 sessionStorage 打标记；每个页面加载后若发现标记，
       在用户第一次点击/按键时自动恢复全屏。
       用户在本页主动退出全屏（Esc/按钮）时清除标记，不再强制恢复。 */
    (function () {
      var KEY = 'mygame-sticky-fullscreen';
      var onGesture = null;
      function dropGesture() {
        if (!onGesture) return;
        document.removeEventListener('pointerdown', onGesture);
        document.removeEventListener('keydown', onGesture);
        onGesture = null;
      }
      document.addEventListener('fullscreenchange', function () {
        if (document.fullscreenElement) {
          sessionStorage.setItem(KEY, '1');
          dropGesture();
        } else if (document.visibilityState === 'visible') {
          /* 页面可见时的退出 = 用户主动退出 → 取消跨页保持；
             跳转卸载时的退出（页面已隐藏）不清标记，由下一页恢复 */
          sessionStorage.removeItem(KEY);
        }
      });
      /* 跳转前若仍处于全屏，确保标记在（双保险） */
      window.addEventListener('pagehide', function () {
        if (document.fullscreenElement) sessionStorage.setItem(KEY, '1');
      });
      if (sessionStorage.getItem(KEY) !== '1' || document.fullscreenElement) return;
      onGesture = function () {
        document.documentElement.requestFullscreen().catch(function () {});
      };
      document.addEventListener('pointerdown', onGesture);
      document.addEventListener('keydown', onGesture);
    })();
  </script>
