<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 资源路径一律相对 game/index.html 解析（assets.js 里存的就是这种相对路径）。
     本页在 tools/ 下，用 <base> 把基准拉回 game/，下面的 href/src 才能照抄站内写法。 -->
<base href="../">
<title>节点预览 / node preview</title>
<!--
  单节点渲染预览：把剧本某个节点用「游戏本体的同一套渲染管线」画出来，
  不需要真的从序章玩到那里，也不需要启动 index.html 的整套流程。

  用法（必须经 HTTP 打开，file:// 下部分资源会被 CORS 拦住）：
    python -m http.server 8777 --bind 127.0.0.1      # 在工作区根目录执行
    http://127.0.0.1:8777/game/tools/preview-node.html?node=s11a
    ...&node=s11a2&ch=prologue        # ch 省略时默认 prologue
    ...&mode=scene                    # 只画场景，不画对白框（默认画）

  它加载的是真实文件：data/assets.js（资源表）、data/story/*.js（剧本）、
  story/script-edits.js + src/script-review-model.js（修订层），
  所以看到的就是玩家实际会看到的画面（含 backgroundFit / 修订层覆盖的结果）。

  注意：本页只挂 #stage + 对白框，不加载 main.js，因此没有 BGM / 语音 / 存档。
-->
<script>
  (function () {
    function fit() {
      document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1280, innerHeight / 720));
    }
    fit(); addEventListener('resize', fit);
  })();
</script>
<link rel="stylesheet" href="styles/game.css">
<link rel="stylesheet" href="styles/prologue.css">
<link rel="stylesheet" href="styles/stage.css">
<link rel="stylesheet" href="styles/chapter1.css">
<link rel="stylesheet" href="styles/memories.css">
<link rel="stylesheet" href="styles/chapters.css">
<style>html,body{margin:0;height:100%;background:#000}#node-error{position:absolute;z-index:99;left:12px;top:12px;color:#ff9a9a;font:13px/1.6 monospace}</style>
</head>
<body>
<div id="game-frame">
  <main><section id="stage"></section></main>
</div>
<p id="node-error"></p>
<script src="src/bootstrap.js"></script>
<script src="data/assets.js"></script>
<script src="data/chapter-assets.js"></script>
<script src="data/uploaded-assets.js"></script>
<script src="src/core/assets.js"></script>
<script src="src/core/dom.js"></script>
<script src="src/core/scene.js"></script>
<script src="data/story/prologue.js"></script>
<script src="data/story/chapter1.js"></script>
<script src="data/story/chapter2.js"></script>
<script src="data/story/chapter3.js"></script>
<script src="data/story/heroine.js"></script>
<script src="data/story/final.js"></script>
<script src="data/story/script-edits.js"></script>
<script src="src/script-review-model.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const storyKey = params.get('ch') || 'prologue';
  const nodeId = params.get('node') || 's11a';
  const sceneOnly = params.get('mode') === 'scene';
  const fail = message => { document.querySelector('#node-error').textContent = message; };

  const story = ILY.data.stories[storyKey];
  if (!story) { fail('找不到剧本：' + storyKey); return; }

  // 与 main.js 的 initScriptEditor 一致：先合并修订层，再套用到 story.nodes
  const records = ILYScriptReview.mergeRecords(window.ILY_SCRIPT_EDITS || {}, {});
  ILYScriptReview.create(story).apply(records);

  const assets = new ILY.Assets(ILY.data.assets);
  const stage = document.querySelector('#stage');

  window.previewNode = async function (id) {
    const node = story.nodes[id];
    if (!node) { fail('找不到节点：' + storyKey + '.' + id); return null; }
    fail('');
    stage.replaceChildren();
    stage.dataset.mode = node.type;
    ILY.mountScene(stage, node, assets);
    if (!sceneOnly && ['dialogue', 'monologue', 'heroine-card'].includes(node.type)) {
      const box = ILY.el('section', 'dialogue');
      const text = ILY.el('p', 'dialogue-text', node.text || '');
      const actions = ILY.el('div', 'actions');
      actions.append(ILY.el('span', 'advance-hint', node.type === 'dialogue' ? '▼' : '…'));
      box.append(ILY.el('div', 'speaker', node.speaker || ''), text, actions);
      stage.append(box);
    }
    const img = stage.querySelector('.scene-background');
    if (img) await img.decode().catch(() => {});
    const portrait = stage.querySelector('.portrait');
    return {
      id,
      type: node.type,
      background: node.cg || node.background,
      cg: node.cg || null,
      portrait: node.portrait || null,
      fit: node.backgroundFit || '(default cover)',
      resolved: assets.image(node.cg || node.background),
      imageNatural: img ? img.naturalWidth + 'x' + img.naturalHeight : null,
      imageRendered: img ? Math.round(img.getBoundingClientRect().width) + 'x' + Math.round(img.getBoundingClientRect().height) : null,
      portraitNatural: portrait ? portrait.naturalWidth + 'x' + portrait.naturalHeight : null
    };
  };

  window.previewNode(nodeId).then(info => { if (info) console.log('preview', JSON.stringify(info)); });
})();
</script>
</body>
</html>
