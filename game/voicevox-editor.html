<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I.L.Y · VOICEVOX 配音编辑器</title><link rel="stylesheet" href="voicevox-editor.css"><link rel="stylesheet" href="voicevox-p2.css"></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">音</span><div><b>VOICEVOX 配音工作台</b><small>日语语音制作 · 中文字幕保持不变</small></div></div><div class="top-actions"><button id="engineBtn" class="status"><i></i>检测引擎</button><select id="importEncoding" title="导入编码"><option value="utf-8">UTF-8</option><option value="shift_jis">Shift-JIS</option><option value="gb18030">GB18030</option></select><button id="importBtn">导入日语稿</button><input id="fileInput" type="file" accept=".txt,.tsv,.csv,.json" multiple hidden><button id="sourceBtn">同步游戏台词</button><button id="exportBtn">导出翻译稿</button><button id="saveBtn" class="primary">保存工程</button></div></header>
<main class="workspace"><aside class="sidebar"><div class="panel-head"><span>工程导航</span><span id="lineCount" class="count">0 句</span></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索台词、角色或 ID"></label><div class="filter-group"><label>章节</label><select id="chapterFilter"><option value="">全部章节</option></select></div><div class="filter-group"><label>状态</label><div class="chips" id="statusFilters"><button data-value="">全部</button><button data-value="untranslated">待翻译</button><button data-value="ready">已准备</button><button data-value="stale">需复核</button></div></div><div class="filter-group"><label>角色</label><div id="speakerFilters" class="speaker-list"></div></div><div class="sidebar-foot"><span>工程版本</span><code id="revision">未保存</code></div></aside>
<section class="sheet"><div class="sheet-toolbar"><div><b>台词工作表</b><small id="selectionText">选择一句开始编辑</small></div><div class="toolbar-actions"><button id="pagePrev" title="上一页">‹</button><span id="pageText">1 / 1</span><button id="pageNext" title="下一页">›</button><button id="batchBtn">批量设置</button><button id="clearBtn">清除筛选</button></div></div><div class="table-wrap"><table><thead><tr><th class="check"><input id="allCheck" type="checkbox"></th><th>台词 / 中文对照</th><th>角色</th><th>风格</th><th>状态</th></tr></thead><tbody id="lineTable"></tbody></table><div id="empty" class="empty">还没有台词。可以载入游戏有效剧本，或导入带有 <code>line_id</code> 和 <code>speech_text</code> 的 TSV。</div></div></section>
<aside class="inspector"><div class="panel-head"><span>声音与调音</span><span id="dirtyDot" class="dirty hidden">● 未保存</span></div><div id="noSelection" class="placeholder">从中间选择一句台词</div><div id="editor" class="hidden"><div class="source-card"><div class="eyebrow">中文显示文本</div><p id="displayText"></p><div class="line-meta"><code id="lineId"></code><span id="sourceMeta"></span></div></div><label class="check-line"><input id="voiceEnabled" type="checkbox"> 纳入正式配音发布</label><p id="voicePolicy" class="hint"></p><label class="field"><span>日语配音文本</span><textarea id="speechText" rows="4" placeholder="填写已翻译并校对的日语"></textarea></label><div class="voice-grid"><label class="field"><span>VOICEVOX 风格</span><select id="styleSelect"><option>请先检测引擎</option></select></label><label class="field"><span>校对状态</span><select id="translationStatus"><option value="untranslated">待翻译</option><option value="draft">翻译草稿</option><option value="proofread">已校对</option></select></label></div><div class="tuning"><div class="section-title">基础参数 <button id="resetTune" class="link">重置</button></div><div class="range-row"><label>语速 <output id="speedOut">1.00</output></label><input id="speed" type="range" min="0.5" max="2" step="0.01" value="1"></div><div class="range-row"><label>音高 <output id="pitchOut">0.00</output></label><input id="pitch" type="range" min="-0.15" max="0.15" step="0.01" value="0"></div><div class="range-row"><label>抑扬 <output id="intonationOut">1.00</output></label><input id="intonation" type="range" min="0" max="2" step="0.01" value="1"></div><div class="range-row"><label>音量 <output id="volumeOut">1.00</output></label><input id="volume" type="range" min="0" max="2" step="0.01" value="1"></div></div><div class="inspector-actions"><button id="queryBtn">生成语音查询</button><button id="previewBtn" class="primary">▶ 试听</button></div><div id="queryState" class="hint">先生成 AudioQuery，再试听。</div></div></aside></main>
<footer class="queue"><div><span class="queue-dot"></span><b>制作队列</b><span id="queueText">未选择台词</span><span id="queueProgress"></span></div><div><button id="queueBtn">加入所选</button><button id="queuePause">暂停</button><button id="queueRetry">重试失败</button><button id="queueCancel">取消进行中</button><button id="batchExport">导出所选 WAV</button><button id="publishBtn" class="primary">发布所选</button><button id="queueClear" class="link">清除选择</button></div></footer>
<div id="batchPanel" class="modal hidden"><div class="modal-card"><div class="panel-head"><span>批量设置（仅作用于已勾选台词）</span><button id="batchClose" class="link">关闭</button></div><label class="field"><span>声音风格</span><select id="batchStyle"><option value="">保持不变</option></select></label><label class="field"><span>校对状态</span><select id="batchStatus"><option value="">保持不变</option><option value="draft">翻译草稿</option><option value="proofread">已校对</option></select></label><div class="voice-grid"><label class="field"><span>语速</span><input id="batchSpeed" type="number" min="0.5" max="2" step="0.01" placeholder="保持"></label><label class="field"><span>音高</span><input id="batchPitch" type="number" min="-0.15" max="0.15" step="0.01" placeholder="保持"></label><label class="field"><span>抑扬</span><input id="batchIntonation" type="number" min="0" max="2" step="0.01" placeholder="保持"></label><label class="field"><span>音量</span><input id="batchVolume" type="number" min="0" max="2" step="0.01" placeholder="保持"></label></div><label class="check-line"><input id="saveRolePreset" type="checkbox"> 同时保存为这些角色的工程默认值</label><div class="inspector-actions"><button id="undoBatch">撤销上次批量操作</button><button id="batchApply" class="primary">应用到所选</button></div></div></div>
<div id="toast" class="toast"></div><script type="module" src="voicevox-editor.js"></script></body></html>
